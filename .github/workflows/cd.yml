name: CD - Deploy Microservices

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to deploy (or "all" for all 7 backend services)'
        required: true
        default: 'all'
        type: choice
        options:
          - analytics-service
          - cart-service
          - customer-service
          - inventory-service
          - order-service
          - payment-service
          - product-service
          - all

permissions:
  contents: read
  actions: read

jobs:
  determine-services:
    name: Determine Services to Deploy
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Set matrix services
        id: set-matrix
        run: |
          SELECTED="${{ github.event.inputs.service }}"
          if [ "$SELECTED" = "all" ] || [ -z "$SELECTED" ]; then
            SERVICES='["analytics-service","cart-service","customer-service","inventory-service","order-service","payment-service","product-service"]'
          else
            SERVICES="[\"${SELECTED}\"]"
          fi
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: determine-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Download ZIP artifact from latest CI build
        uses: dawidd6/action-download-artifact@v4
        with:
          workflow: ci.yml
          workflow_conclusion: success
          branch: main
          name: lambda-${{ matrix.service }}
          path: ${{ matrix.service }}

      - name: Deploy Lambda function code and update alias
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          FUNCTION_NAME="${SERVICE_NAME}-pepin"
          ZIP_PATH="${SERVICE_NAME}/${SERVICE_NAME}.zip"

          echo "=========================================="
          echo "Deploying ${SERVICE_NAME} to ${FUNCTION_NAME}"
          echo "ZIP file: ${ZIP_PATH}"
          echo "=========================================="

          if [ ! -f "${ZIP_PATH}" ]; then
            echo "::error::Artifact ZIP file not found at ${ZIP_PATH}"
            exit 1
          fi

          # 1. Update Lambda function code
          echo "Updating function code for ${FUNCTION_NAME}..."
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --zip-file "fileb://${ZIP_PATH}" \
            --region ap-southeast-1

          # 2. Wait for Lambda code update to settle
          echo "Waiting for ${FUNCTION_NAME} to complete update..."
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region ap-southeast-1

          # 3. Publish a new immutable version number
          echo "Publishing new version for ${FUNCTION_NAME}..."
          NEW_VERSION=$(aws lambda publish-version \
            --function-name "${FUNCTION_NAME}" \
            --description "Deployed via CD pipeline (commit ${GITHUB_SHA}, run ${GITHUB_RUN_NUMBER})" \
            --region ap-southeast-1 \
            --query 'Version' \
            --output text)

          echo "Published new version: ${NEW_VERSION}"

          # 4. Point the 'dev' alias to the newly published version
          echo "Updating 'dev' alias to version ${NEW_VERSION}..."
          if aws lambda get-alias --function-name "${FUNCTION_NAME}" --name dev --region ap-southeast-1 >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "${FUNCTION_NAME}" \
              --name dev \
              --function-version "${NEW_VERSION}" \
              --description "Alias pointing to version ${NEW_VERSION}" \
              --region ap-southeast-1
          else
            aws lambda create-alias \
              --function-name "${FUNCTION_NAME}" \
              --name dev \
              --function-version "${NEW_VERSION}" \
              --description "Alias pointing to version ${NEW_VERSION}" \
              --region ap-southeast-1
          fi

      - name: Verify active alias deployment
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          FUNCTION_NAME="${SERVICE_NAME}-pepin"

          echo "=========================================="
          echo "Verifying deployment for ${FUNCTION_NAME} [dev alias]"
          echo "=========================================="

          ALIAS_INFO=$(aws lambda get-alias \
            --function-name "${FUNCTION_NAME}" \
            --name dev \
            --region ap-southeast-1 \
            --output json)

          ACTIVE_VERSION=$(echo "${ALIAS_INFO}" | grep -o '"FunctionVersion": "[^"]*"' | cut -d'"' -f4)
          ALIAS_ARN=$(echo "${ALIAS_INFO}" | grep -o '"AliasArn": "[^"]*"' | cut -d'"' -f4)

          echo "Success! ${FUNCTION_NAME} 'dev' alias is currently active:"
          echo "  - Function Version : ${ACTIVE_VERSION}"
          echo "  - Alias ARN        : ${ALIAS_ARN}"
