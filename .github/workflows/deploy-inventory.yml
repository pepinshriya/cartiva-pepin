name: Deploy - Inventory Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
      artifact_run_id:
        description: 'Optional ID of the CI workflow run that built the ZIP artifact (leave empty to use the current run)'
        required: false
        default: ''
        type: string

jobs:
  backend-deploy:
    name: Deploy
    uses: ./.github/workflows/reusable-backend-deploy.yml
    with:
      service: inventory-service
      environment: ${{ inputs.environment || 'dev' }}
      artifact-run-id: ${{ inputs.artifact_run_id }}
    secrets: inherit
