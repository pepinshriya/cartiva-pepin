name: Reusable Backend CI

on:
  workflow_call:
    inputs:
      service:
        description: 'Service directory name (e.g. product-service)'
        required: true
        type: string
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'

permissions:
  contents: read

jobs:
  quality:
    name: ${{ inputs.service }} - quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (restore npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run format check
        run: npm run format:check --if-present

      - name: Run all tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Package Lambda into ZIP artifact
        run: |
          SERVICE="${{ inputs.service }}"
          PKG="package"

          echo "::group::Packaging ${SERVICE}"
          mkdir -p "${PKG}"

          rsync -a \
            --exclude '*.zip' \
            --exclude 'node_modules' \
            --exclude '.env*' \
            --exclude '.git*' \
            --exclude 'coverage' \
            --exclude 'package' \
            "./" "${PKG}/"

          cp -r node_modules "${PKG}/node_modules"

          if [ "${SERVICE}" = "frontend" ]; then
            node -e '
              const fs = require("fs");
              const code = `const fs = require("fs");
const path = require("path");

const distDir = path.join(__dirname, "dist");

const CONTENT_TYPES = {
  ".html": "text/html; charset=utf-8",
  ".js": "application/javascript; charset=utf-8",
  ".css": "text/css; charset=utf-8",
  ".json": "application/json; charset=utf-8",
  ".png": "image/png",
  ".jpg": "image/jpeg",
  ".jpeg": "image/jpeg",
  ".gif": "image/gif",
  ".svg": "image/svg+xml",
  ".ico": "image/x-icon",
  ".woff": "font/woff",
  ".woff2": "font/woff2",
};

function respond(statusCode, headers, body) {
  return { statusCode, headers, body: Buffer.from(body).toString("base64"), isBase64Encoded: true };
}

module.exports.handler = async (event) => {
  try {
    let filePath = event.path || "/";
    if (filePath === "/") filePath = "/index.html";

    const fullPath = path.join(distDir, filePath);
    if (!fullPath.startsWith(distDir)) {
      return respond(403, { "Content-Type": "text/plain" }, "Forbidden");
    }

    const body = fs.readFileSync(fullPath);
    const ext = path.extname(fullPath).toLowerCase();
    return respond(200, { "Content-Type": CONTENT_TYPES[ext] || "application/octet-stream" }, body);
  } catch (error) {
    if (error.code === "ENOENT") {
      try {
        const body = fs.readFileSync(path.join(distDir, "index.html"));
        return respond(200, { "Content-Type": "text/html; charset=utf-8" }, body);
      } catch (notFound) {
        return respond(404, { "Content-Type": "text/plain" }, "Not Found");
      }
    }
    console.error("Frontend handler error:", error);
    return respond(500, { "Content-Type": "text/plain" }, "Internal Server Error");
  }
};
`;
              fs.writeFileSync(process.argv[1] + "/index.js", code);
            ' "${PKG}"
          else
            echo "module.exports.handler = require('./src/lambda').handler;" > "${PKG}/index.js"
          fi

          (cd "${PKG}" && zip -qr "../${SERVICE}.zip" .)
          echo "::endgroup::"
          echo "Created package: $(ls -lh "${SERVICE}.zip" | awk '{print $5}')"
          unzip -l "${SERVICE}.zip" | head -20

      - name: Inspect packaged artifacts
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -R
          echo "ZIP files:"
          find . -name "*.zip"

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ inputs.service }}
          path: ${{ inputs.service }}/${{ inputs.service }}.zip
          if-no-files-found: error
          retention-days: 7
