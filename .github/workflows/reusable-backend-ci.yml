name: Reusable Backend CI

on:
  workflow_call:
    inputs:
      service:
        description: 'Service directory name (e.g. product-service)'
        required: true
        type: string
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'

permissions:
  contents: read

jobs:
  quality:
    name: ${{ inputs.service }} - quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (restore npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run format check
        run: npm run format:check --if-present

      - name: Run all tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Package Lambda into ZIP artifact
        run: |
          SERVICE="${{ inputs.service }}"
          PKG="package"

          echo "::group::Packaging ${SERVICE}"
          mkdir -p "${PKG}"

          rsync -a \
            --exclude '*.zip' \
            --exclude 'node_modules' \
            --exclude '.env*' \
            --exclude '.git*' \
            --exclude 'coverage' \
            --exclude 'package' \
            "./" "${PKG}/"

          if [ "${SERVICE}" = "frontend" ]; then
            cp "../shared/templates/lambda-frontend-index.js" "${PKG}/index.js"
          else
            cp "../shared/templates/lambda-backend-index.js" "${PKG}/index.js"
            (cd "${PKG}" && npm ci --omit=dev)
          fi

          (cd "${PKG}" && zip -qrX "../${SERVICE}.zip" .)
          echo "::endgroup::"

      - name: Verify Lambda ZIP artifact
        run: |
          SERVICE="${{ inputs.service }}"
          ZIP_FILE="${SERVICE}.zip"
          MAX_BYTES=47185920 # 45MB threshold

          if [ ! -f "${ZIP_FILE}" ]; then
            echo "::error::Zip file ${ZIP_FILE} does not exist."
            exit 1
          fi

          SIZE_BYTES=$(wc -c < "${ZIP_FILE}" | tr -d ' ')
          echo "Zip size: ${SIZE_BYTES} bytes"

          if [ "${SIZE_BYTES}" -le 0 ]; then
            echo "::error::Zip file ${ZIP_FILE} is empty (0 bytes)."
            exit 1
          fi

          if [ "${SIZE_BYTES}" -gt "${MAX_BYTES}" ]; then
            echo "::error::Zip file ${ZIP_FILE} (${SIZE_BYTES} bytes) exceeds maximum limit of 45MB (${MAX_BYTES} bytes)."
            exit 1
          fi

          echo "Listing zip contents (first 20 lines):"
          unzip -l "${ZIP_FILE}" | head -20

          if ! unzip -l "${ZIP_FILE}" | grep -q "index.js"; then
            echo "::error::Zip file ${ZIP_FILE} is missing required entrypoint index.js."
            exit 1
          fi

          echo "::notice::Artifact ${ZIP_FILE} verified successfully (${SIZE_BYTES} bytes)."

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ inputs.service }}
          path: ${{ inputs.service }}/${{ inputs.service }}.zip
          if-no-files-found: error
          retention-days: 7
