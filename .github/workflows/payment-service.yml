name: CI - Payment Service

on:
  push:
    branches: [develop, main]
    paths:
      - 'payment-service/**'
      - '.github/workflows/reusable-backend-ci.yml'
  pull_request:
    paths:
      - 'payment-service/**'
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/reusable-backend-ci.yml
    with:
      service: payment-service
