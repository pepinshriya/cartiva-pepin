          cache-dependency-path: cart-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Package Lambda code into ZIP
        run: |
          mkdir -p package
          rsync -a --exclude 'node_modules' --exclude 'package' --exclude '*.zip' --exclude '.git*' --exclude 'coverage' ./ package/
          cp ../shared/templates/lambda-backend-index.js package/index.js
          (cd package && npm ci --omit=dev)
          (cd package && zip -qrX "../cart-service.zip" .)

      - name: Verify ZIP artifact
        run: |
          echo "Verifying cart-service.zip contents:"
          unzip -l cart-service.zip | head -20
          if ! unzip -l cart-service.zip | grep -q "index.js"; then
            echo "::error::index.js is missing from cart-service.zip"
            exit 1
          fi

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
