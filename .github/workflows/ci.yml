name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build and deploy'
        required: true
        type: choice
        options:
          - product-service
          - cart-service
          - order-service
          - payment-service
          - inventory-service
          - customer-service
          - analytics-service
          - frontend

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  lint-format:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      backend_services: ${{ steps.detect.outputs.backend_services }}
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_REF: ${{ github.ref }}
          SELECTED: ${{ inputs.service }}
        run: |
          KNOWN_SERVICES='product-service cart-service order-service payment-service inventory-service customer-service analytics-service frontend'

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - selected service: ${SELECTED}"
            SERVICES="[\"${SELECTED}\"]"
            DEPLOY="true"
          else
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              BASE_SHA="${PR_BASE}"
            else
              BASE_SHA="${PUSH_BEFORE}"
            fi

            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit found - treating all services as changed."
              CHANGED_TOP=$(git ls-tree -r --name-only HEAD | cut -d/ -f1 | sort -u)
            else
              CHANGED_TOP=$(git diff --name-only "${BASE_SHA}" HEAD | cut -d/ -f1 | sort -u)
            fi

            echo "Changed top-level paths:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${CHANGED_TOP}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            SERVICES="[]"
            SHARED_CHANGE="false"
            for dir in ${CHANGED_TOP}; do
              case " ${KNOWN_SERVICES} " in
                *" ${dir} "*) SERVICES=$(echo "${SERVICES}" | jq -c --arg s "${dir}" '. + [$s]') ;;
                docs) echo "Ignoring documentation change (${dir})." ;;
                *) SHARED_CHANGE="true" ;;
              esac
            done

            if [ "${SHARED_CHANGE}" = "true" ]; then
              echo "::warning::Shared change detected outside service directories - deploying all services."
              SERVICES='["product-service","cart-service","order-service","payment-service","inventory-service","customer-service","analytics-service","frontend"]'
            fi

            if [ "${EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
              DEPLOY="true"
            else
              DEPLOY="false"
            fi
          fi

          BACKEND_SERVICES=$(echo "${SERVICES}" | jq -c '[.[] | select(. != "frontend")]')
          HAS_BACKEND=$(echo "${BACKEND_SERVICES}" | jq 'length > 0')
          HAS_FRONTEND=$(echo "${SERVICES}" | jq 'any(. == "frontend")')

          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "backend_services=${BACKEND_SERVICES}" >> "$GITHUB_OUTPUT"
          echo "has_backend=${HAS_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "has_frontend=${HAS_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"

          echo "Detected services: ${SERVICES}"
          echo "Deploy: ${DEPLOY}" >> "$GITHUB_STEP_SUMMARY"
          echo "Detected services: ${SERVICES}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build + package ${{ matrix.service }}
    needs: [detect, lint-format]
    if: needs.detect.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    uses: ./.github/workflows/reusable-backend-ci.yml
    with:
      service: ${{ matrix.service }}

  deploy-backend:
    name: Deploy ${{ matrix.service }} to dev
    needs: [detect, build]
    if: needs.detect.outputs.deploy == 'true' && needs.detect.outputs.has_backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.backend_services) }}
    uses: ./.github/workflows/reusable-backend-deploy.yml
    with:
      service: ${{ matrix.service }}
      environment: dev
    secrets: inherit

  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    needs: [detect, build]
    if: needs.detect.outputs.deploy == 'true' && needs.detect.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-frontend
          path: artifact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        env:
          S3_BUCKET: cartiva-frontend-pepin-04
        run: |
          echo "::group::Syncing frontend build to s3://${S3_BUCKET}"
          unzip -q artifact/frontend.zip -d frontend-build
          aws s3 sync frontend-build/dist "s3://${S3_BUCKET}" --delete --region "$AWS_REGION" --only-show-errors
          echo "::endgroup::"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DOMAIN: dn3bz7vki39ts.cloudfront.net
        run: |
          echo "::group::Invalidating CloudFront cache for https://${CLOUDFRONT_DOMAIN}/"
          DIST_ID=$(aws cloudfront list-distributions \
            --region "$AWS_REGION" \
            --query "DistributionList.Items[?DomainName=='${CLOUDFRONT_DOMAIN}'].Id" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::No CloudFront distribution found for domain '${CLOUDFRONT_DOMAIN}'. Ensure the deploy role has cloudfront:ListDistributions."
            exit 1
          fi
          INVAL=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --region "$AWS_REGION" \
            --query "Invalidation.{Id:Id,Status:Status}" \
            --output json)
          echo "CloudFront invalidation: ${INVAL}"
          echo "CloudFront invalidation: ${INVAL}" >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
