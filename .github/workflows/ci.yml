name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-service:
    name: Analytics Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: analytics-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Run Snyk Open Source Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Package Lambda code into ZIP
        run: |
          mkdir -p package
          rsync -a --exclude 'node_modules' --exclude 'package' --exclude '*.zip' --exclude '.git*' --exclude 'coverage' ./ package/
          cp ../shared/templates/lambda-backend-index.js package/index.js
          (cd package && npm ci --omit=dev)
          (cd package && zip -qrX "../analytics-service.zip" .)

      - name: Verify ZIP artifact
        run: |
          echo "Verifying analytics-service.zip contents:"
          unzip -l analytics-service.zip | head -20
          if ! unzip -l analytics-service.zip | grep -q "index.js"; then
            echo "::error::index.js is missing from analytics-service.zip"
            exit 1
          fi

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-analytics-service
          path: analytics-service/analytics-service.zip
          if-no-files-found: error
          retention-days: 7

